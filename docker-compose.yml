services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: house-price-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: house-price-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend